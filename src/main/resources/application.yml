server:
  port: 8080
  servlet:
    encoding:
      # UTF-8 인코딩 설정
      charset: UTF-8
      # 인코딩 활성화 
      enabled: true 
      #모든 요청과 응답에 UTF-8 인코딩 강제 적용
      force: true  

spring:
  application:
    name: wms
  datasource:
    # Vercel에서 제공하는 드라이버 클래스 이름 (보통 자동 인식되지만 명시해주는 게 안전합니다)
    driver-class-name: org.postgresql.Driver
    # Vercel 대시보드에서 복사한 외부 접속용 URL
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 커넥션 생성 시마다 search_path 강제 설정 (Neon 풀러 환경에서 currentSchema URL 파라미터 미적용 대응)
      connection-init-sql: SET search_path TO wms

# MyBatis 설정
mybatis:
  # SQL 쿼리가 작성될 XML 파일의 위치
  mapper-locations: classpath:mapper/*.xml
  # DB 컬럼명(snake_case)을 Kotlin 객체 필드명(camelCase)으로 자동 매핑
  configuration:
    map-underscore-to-camel-case: true
    # null 값을 처리할 때 JDBC 타입을 'null'로 설정하여 NullPointerException 방지
    jdbc-type-for-null: 'null'

# 로깅 설정
logging:
  level:
    "[com.cjlogistics.wms]": DEBUG

security:
  jwt:
    # JWT 서명에 사용할 비밀 키 (실제 운영에서는 안전하게 관리해야 함)
    secret      : CJLOGISTICS_ACCESS_SECRET_TOKEN_KEY_2026_1234567890 
    # JWT 발급자 정보 (예: 애플리케이션 이름)         
    issuer      : wms                                 
    # JWT 토큰의 유효 기간 (초 단위, 예: 3600초 = 1시간)                  
    expiration  : 3600